# Every class is a service, so a view helper gets what it needs injected.
# The processors stand here once more, under the names the TypoScript
# uses.
services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  # Not the list of a form's errors: it needs the form framework, which a
  # site can go without. It asks for that service when a form renders.
  TYPO3\Soul\Theme\:
    resource: '../Classes/*'
    exclude: '../Classes/ViewHelpers/Form/ErrorsViewHelper.php'

  TYPO3\Soul\Theme\DataProcessing\ChromeProcessor:
    tags:
      - { name: 'data.processor', identifier: 'soul-chrome' }

  TYPO3\Soul\Theme\DataProcessing\BandsProcessor:
    tags:
      - { name: 'data.processor', identifier: 'soul-bands' }

  TYPO3\Soul\Theme\DataProcessing\SectionsProcessor:
    tags:
      - { name: 'data.processor', identifier: 'soul-sections' }

  TYPO3\Soul\Theme\DataProcessing\LinesProcessor:
    tags:
      - { name: 'data.processor', identifier: 'soul-lines' }

  TYPO3\Soul\Theme\DataProcessing\TableProcessor:
    tags:
      - { name: 'data.processor', identifier: 'soul-table' }

  TYPO3\Soul\Theme\DataProcessing\EntriesProcessor:
    tags:
      - { name: 'data.processor', identifier: 'soul-entries' }
