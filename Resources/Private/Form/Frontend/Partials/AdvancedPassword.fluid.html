<f:comment>
    The password and the same password again, as two fields of one value.
</f:comment>
<formvh:renderRenderable renderable="{element}">
    <f:render partial="Soul/Control" arguments="{element: element, tag: 'sds-field', path: 'password', of: {type: 'password'}}" />
    <f:render partial="Soul/Control" arguments="{element: element, tag: 'sds-field', path: 'confirmation', labelProperty: 'confirmationLabel', of: {type: 'password'}}" />
</formvh:renderRenderable>
