<f:comment>
    Fields side by side, as many across as the row holds and the room
    permits.
</f:comment>
<formvh:renderRenderable renderable="{element}">
    <sds-grid {soul:attributes(of: {columns: '{f:count(subject: element.elements)}'})}>
        <f:for each="{element.elements}" as="column">
            <f:if condition="{column.enabled}">
                <div><f:render partial="{column.templateName}" arguments="{element: column}" /></div>
            </f:if>
        </f:for>
    </sds-grid>
</formvh:renderRenderable>
