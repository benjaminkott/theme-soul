<f:comment>
    The table as the element's columns and rows. The head row, the head
    column and the caption are the editor's choice.
</f:comment>
<f:layout name="Content/Default" />
<f:section name="Main">
    <f:if condition="{rows}">
        <f:variable name="caption">{record -> f:render.text(field: 'table_caption', optional: true)}</f:variable>
        <sds-table {soul:attributes(of: {columns: columns, rows: rows, caption: caption}, flags: {scrollable: 1})}></sds-table>
    </f:if>
</f:section>
