<f:comment>
    Statements side by side, each on a plane of its own. What a plane
    states stands between the tags.
</f:comment>
<f:layout name="Content/Default" />
<f:section name="Main">
    <sds-grid {soul:attributes(of: {columns: data.tx_themesoul_columns})}>
        <f:for each="{record.tx_themesoul_items}" as="item">
            <sds-surface {soul:attributes(of: {label: item.label, icon: item.icon, heading: item.header})}>{item -> f:render.text(field: 'text')}</sds-surface>
        </f:for>
    </sds-grid>
</f:section>
