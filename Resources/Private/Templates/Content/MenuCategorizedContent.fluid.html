<f:layout name="Content/Default" />
<f:section name="Main">
    <f:if condition="{content}">
        <ul>
            <f:for each="{content}" as="element">
                <f:variable name="href"><f:uri.page pageUid="{element.data.pid}" section="c{element.data.uid}" /></f:variable>
                <li><sds-link {soul:attributes(of: {label: element.data.header, href: href})}></sds-link></li>
            </f:for>
        </ul>
    </f:if>
</f:section>
