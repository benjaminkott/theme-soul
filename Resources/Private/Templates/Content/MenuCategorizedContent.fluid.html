<f:layout name="Content/Default" />
<f:section name="Main">
    <f:if condition="{content}">
        <ul>
            <f:for each="{content}" as="element">
                <li><f:link.page pageUid="{element.data.pid}" section="c{element.data.uid}">{element.data.header}</f:link.page></li>
            </f:for>
        </ul>
    </f:if>
</f:section>
