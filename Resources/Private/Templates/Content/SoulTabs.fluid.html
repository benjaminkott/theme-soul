<f:comment>
    Panels behind tabs, one open at a time. The first marked one is open,
    and the first one where none is.
</f:comment>
<f:layout name="Content/Default" />
<f:section name="Main">
    <sds-tabs>
        <f:for each="{record.tx_themesoul_items}" as="item">
            <sds-tab-item {soul:attributes(of: {label: item.header, icon: item.icon}, flags: {active: item.marked})}>{item -> f:render.text(field: 'text')}</sds-tab-item>
        </f:for>
    </sds-tabs>
</f:section>
