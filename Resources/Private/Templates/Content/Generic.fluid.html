<f:comment>
    A type with no template of its own, a plugin among them: its heading,
    and what the plugin renders. That output is the plugin's markup, and
    the plugin's templates are where it takes the system's elements.
</f:comment>
<f:layout name="Content/Default" />
<f:section name="Main">
    <f:if condition="{content}">
        <f:then>{content -> f:format.raw()}</f:then>
        <f:else><f:cObject typoscriptObjectPath="tt_content.{data.CType}.20" data="{data}" table="tt_content" /></f:else>
    </f:if>
</f:section>
