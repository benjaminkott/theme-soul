<f:comment>
    Files to take away: the name as the link, then the size and the
    description where the editor asked for them.
</f:comment>
<f:layout name="Content/Default" />
<f:section name="Main">
    <f:if condition="{files}">
        <ul>
            <f:for each="{files}" as="file">
                <li>
                    <a href="{file.publicUrl}" download {soul:attributes(of: {target: data.target})}>{f:if(condition: file.properties.title, then: file.properties.title, else: file.name)}</a>
                    <f:if condition="{data.filelink_size}"> · <f:format.bytes value="{file.properties.size}" /></f:if>
                    <f:if condition="{data.uploads_description} && {file.properties.description}"><br>{file.properties.description}</f:if>
                </li>
            </f:for>
        </ul>
    </f:if>
</f:section>
