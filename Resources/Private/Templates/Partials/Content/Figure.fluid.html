<f:comment>
    One file as a figure. A picture is the element's attributes: the
    processed file, its text for a reader who cannot see it, and its
    description as the claim. Audio and video the element cannot name by an
    attribute, so the player stands between the tags.
</f:comment>
<f:if condition="{file.type} == 2">
    <f:then>
        <f:variable name="src">{f:uri.image(image: file, maxWidth: 1200)}</f:variable>
        <sds-figure {soul:attributes(of: {src: src, alt: file.alternative, caption: file.description}, flags: {zoomable: zoom})}></sds-figure>
    </f:then>
    <f:else>
        <sds-figure {soul:attributes(of: {caption: file.description})}><f:media file="{file}" alt="{file.alternative}" title="{file.title}" additionalConfig="{settings.media.additionalConfig}" /></sds-figure>
    </f:else>
</f:if>
