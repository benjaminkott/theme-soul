identifier: contact
label: Contact
type: Form
prototypeName: standard
finishers:
  -
    identifier: Confirmation
    options:
      message: 'The message is on its way.'
renderingOptions:
  submitButtonLabel: Send
renderables:
  -
    identifier: page-1
    label: 'Your message'
    type: Page
    renderables:
      -
        identifier: name
        label: Name
        type: Text
        properties:
          fluidAdditionalAttributes:
            required: required
            autocomplete: name
        validators:
          -
            identifier: NotEmpty
      -
        identifier: email
        label: Email
        type: Email
        properties:
          elementDescription: 'The answer goes here.'
        validators:
          -
            identifier: EmailAddress
      -
        identifier: topic
        label: Topic
        type: SingleSelect
        properties:
          options:
            question: 'A question'
            bug: 'A bug'
      -
        identifier: reach
        label: 'How to reach you'
        type: RadioButton
        properties:
          options:
            mail: Email
            phone: Phone
      -
        identifier: areas
        label: Areas
        type: MultiCheckbox
        properties:
          options:
            frontend: Frontend
            backend: Backend
      -
        identifier: message
        label: Message
        type: Textarea
      -
        identifier: privacy
        label: 'I agree that the message is stored.'
        type: Checkbox
        properties:
          value: '1'
      -
        identifier: digest
        label: 'Send me the digest'
        type: Checkbox
        properties:
          appearance: switch
      -
        identifier: urgency
        label: Urgency
        type: Number
        properties:
          appearance: range
          unit: '%'
          fluidAdditionalAttributes:
            min: '0'
            max: '100'
            step: '10'
      -
        identifier: secret
        label: Password
        type: AdvancedPassword
        properties:
          confirmationLabel: 'The password again'
